rubrics:
  - id: 1
    type: f2p
    text: 同一非 dry-run 导入标识的并发或重复请求只能归属于一个持久导入操作；相同标识提交不同 bundle 会被明确拒绝，不能静默混合。
  - id: 2
    type: f2p
    text: 请求在 targets、定义或其他早期区段已提交后取消或断开，随后使用同一标识重试会从已记录检查点按既有依赖顺序继续，已完成条目不会重复创建或重复触发副作用。
  - id: 3
    type: f2p
    text: 进程重启或执行租约失效后，新的请求能区分仍在执行、已完成和可接管的导入；最终 ledger 可重复读取，正在执行的请求不会被误报为完成。
  - id: 4
    type: f2p
    text: 逐项校验、权限跳过、ID 重映射、无 secret webhook 跳过、维护窗口 unchanged/reason 冲突和部分条目失败仍逐条给出原有结果，不因恢复机制改成全量回滚。
  - id: 5
    type: f2p
    text: dryRun 不创建可恢复操作或配置写入，未提供标识的旧客户端继续遵循原有逐项非事务行为；带标识的新路径不改变现有权限和请求大小限制。
  - id: 6
    type: p2p
    text: alert rule 同步、RBAC 缓存失效/通知和一次导入审计只在对应条目首次成功检查点发生，重试、并发请求和恢复不会重复广播或重复记账。
